apiVersion: apps/v1
kind: Deployment
metadata:
  name: lrm-operator
  namespace: lrm-system
  labels:
    app: lrm-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lrm-operator
  template:
    metadata:
      labels:
        app: lrm-operator
    spec:
      serviceAccountName: lrm-operator
      containers:
        - name: operator
          image: ghcr.io/ibelverus/lrm-operator:latest
          imagePullPolicy: Always
          command:
            - kopf
            - run
            - --module=lrm_operator
            - --all-namespaces
            - --verbose
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: KOPF_NAMESPACES
              value: ""
