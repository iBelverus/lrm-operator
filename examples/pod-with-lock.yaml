apiVersion: v1
kind: Pod
metadata:
  name: ci-job-runner
  labels:
    app: ci-worker
  annotations:
    lrm.openlab.io/lockable-resource: ci-runners-0
spec:
  restartPolicy: Never
  containers:
    - name: worker
      image: busybox:latest
      command:
        - sh
        - -c
        - "echo 'Locked resource, doing work...' && sleep 30 && echo 'Done'"
      resources:
        requests:
          cpu: "1"
          memory: "1Gi"
        limits:
          cpu: "2"
          memory: "2Gi"
